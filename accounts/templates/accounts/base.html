<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}贪吃蛇用户系统{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'index' %}">🐍 贪吃蛇用户系统</a>
      <div class="d-flex align-items-center">
        {% if user.is_authenticated %}
          <span class="navbar-text me-3">你好，{{ user.username }}</span>
          <a class="btn btn-outline-light btn-sm" href="{% url 'home' %}">个人中心</a>
          <a class="btn btn-outline-light btn-sm ms-2" href="{% url 'logout' %}">退出</a>
        {% else %}
          <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">登录</a>
          <a class="btn btn-outline-light btn-sm ms-2" href="{% url 'register' %}">注册</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <div class="container mt-4 flex-grow-1">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>

  <footer class="text-center text-muted py-3">
    <small>贪吃蛇小游戏 · Django + SQLite</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
