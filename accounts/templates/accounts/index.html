{% extends 'accounts/base.html' %}
{% block title %}首页{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h1 class="display-3">🐍</h1>
  <h1 class="display-4 mb-3">贪吃蛇小游戏</h1>
  <p class="lead text-muted">注册账号，保存你的最高分记录</p>
  {% if user.is_authenticated %}
    <a class="btn btn-success btn-lg mt-3" href="{% url 'home' %}">进入个人中心</a>
  {% else %}
    <a class="btn btn-primary btn-lg mt-3 me-2" href="{% url 'login' %}">登录</a>
    <a class="btn btn-outline-primary btn-lg mt-3" href="{% url 'register' %}">注册新账号</a>
  {% endif %}
</div>
{% endblock %}
