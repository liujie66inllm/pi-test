{% extends 'accounts/base.html' %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card shadow-sm mt-3">
      <div class="card-body p-4">
        <h3 class="text-center mb-4">用户登录</h3>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">用户名</label>
            <input type="text" name="username" class="form-control" placeholder="请输入用户名" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">登 录</button>
        </form>
        <p class="text-center mt-3 mb-0">还没有账号？<a href="{% url 'register' %}">去注册</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
